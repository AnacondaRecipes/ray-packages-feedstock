anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: ray-project/ray
      use_max_tag: true
      prefix: ray-
      include_regex: ^ray-\d+\.\d+\.\d+
      from_pattern: ^ray-(\d+(?:\.\d+)*.*)$
      to_pattern: \1
    packages:
      - ray-adag
      - ray-air
      - ray-all
      - ray-client
      - ray-core
      - ray-dashboard
      - ray-data
      - ray-debug
      - ray-default
      - ray-observability
      - ray-rllib
      - ray-serve
      - ray-serve-grpc
      - ray-train
      - ray-tune
