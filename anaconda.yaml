anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: ray-project/ray
      use_max_tag: true
      exclude_regex: (?i)^(?=.*(?:(?<=\d)rc\d*|(?<=\d)dev\d+|(?:^|[-._])(?:alpha|beta|gamma|pre|preview)(?:\d+)?|[-._]rc\d+|(?:^|[-._])dev\d+|(?:\d+\.)+\d+[ab]\d*)).+$
      from_pattern: ^v?(\d+(?:\.\d+)*.*)$
      to_pattern: \1
    packages:
      - ray-adag
      - ray-air
      - ray-client
      - ray-core
      - ray-dashboard
      - ray-data
      - ray-debug
      - ray-default
      - ray-observability
      - ray-rllib
      - ray-serve
      - ray-serve-grpc
      - ray-train
      - ray-tune
